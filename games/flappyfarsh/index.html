<!DOCTYPE html>
<html lang="ru">
<head>

<title>FlappyFarsh</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#c3bacb;--ink:#111;--card:#fff;--teal:#8ab4bc;--red:#e0584a;--gold:#ffd23a;--app-h:100vh;
  --top:max(env(safe-area-inset-top,0px),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
  --bot:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px))}
@supports (height:100dvh){:root{--app-h:100dvh}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#2b2733;--ink:#f3eff6;--card:#3b3646;--teal:#6f9ea7;--red:#e8695b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#2b2733;--ink:#f3eff6;--card:#3b3646;--teal:#6f9ea7;--red:#e8695b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,-apple-system,Arial,sans-serif;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--top) 0 var(--bot);user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
h1{margin:8px 0;font-weight:800;font-size:clamp(20px,5vw,32px);text-transform:uppercase;transform:rotate(-2deg);line-height:1}
h1 span{color:var(--red)}
.wrap{position:relative;width:min(calc(100vw - 16px),calc((var(--app-h) - var(--top) - var(--bot) - 66px) * .6));container-type:inline-size;border:4px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;background:var(--card)}
canvas#c{width:100%;display:block;aspect-ratio:3/5;cursor:pointer;touch-action:none}
.tg h1,.coarse h1{display:none}
.tg .wrap,.coarse .wrap{width:min(calc(100vw - 12px),calc((var(--app-h) - var(--top) - var(--bot) - 14px) * .6))}
.ov{position:absolute;inset:0;background:#111c;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2cqw;padding:4cqw;text-align:center;font-size:4cqw;overflow:auto}
.ov.top{justify-content:flex-start}
.hide{display:none!important}
.card{background:#fff;color:#111;border:.9cqw solid #111;border-radius:3cqw;padding:2.4cqw 4cqw;width:100%;font-size:3.8cqw}
.lg{display:inline-block;border:.7cqw solid #111;border-radius:99px;padding:.3cqw 3cqw;font-weight:800;margin-right:1.5cqw;color:#111}
.xp{height:3cqw;border:.7cqw solid #111;border-radius:99px;overflow:hidden;margin:1.6cqw 0 1cqw;background:#0002}.xp i{display:block;height:100%;background:var(--teal)}
.b{font:inherit;font-weight:800;border:.9cqw solid #111;background:#fff;color:#111;border-radius:3cqw;padding:2.2cqw 4cqw;cursor:pointer;box-shadow:1cqw 1cqw 0 #111;font-size:4cqw}
.b:active{transform:translate(.8cqw,.8cqw);box-shadow:.2cqw .2cqw 0 #111}.b.r{background:var(--red);color:#fff}.b.t{background:var(--teal);color:#111}.b.g{background:var(--gold);color:#111}.b:disabled{opacity:.42}
.row{display:flex;gap:2cqw;flex-wrap:wrap;justify-content:center;width:100%}
.big{font-weight:800;font-size:12cqw;line-height:1}
input.nm{font:inherit;font-weight:800;text-align:center;border:.9cqw solid #111;border-radius:2.4cqw;padding:1.6cqw;font-size:4cqw;width:46cqw;color:#111;background:#fff}
.tabs{display:flex;gap:1.2cqw;flex-wrap:wrap;justify-content:center;width:100%}.tabs .b{padding:1.3cqw 2.2cqw;font-size:3.2cqw;box-shadow:.6cqw .6cqw 0 #111}.tabs .b.on{background:var(--teal)}
.list{width:100%;text-align:left;display:grid;gap:1.4cqw;font-size:3.4cqw}
.it{background:#fff;color:#111;border:.7cqw solid #111;border-radius:2.2cqw;padding:1.6cqw 2.4cqw;display:flex;justify-content:space-between;align-items:center;gap:2cqw}
.it small{display:block;opacity:.7;font-size:2.8cqw;font-weight:500}.it .b{padding:1cqw 2cqw;font-size:3cqw;box-shadow:.5cqw .5cqw 0 #111;white-space:nowrap}
.pips{display:flex;gap:.7cqw;margin-top:.6cqw}.pips i{width:2.4cqw;height:2.4cqw;border:.5cqw solid #111;border-radius:.6cqw;background:#0002}.pips i.f{background:var(--red)}
.sk{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;width:100%}
.sk>div{background:#fff;color:#111;border:.8cqw solid #111;border-radius:2.4cqw;padding:1cqw 1cqw 1.4cqw;font-size:2.9cqw;font-weight:800;position:relative;cursor:pointer;display:flex;flex-direction:column;gap:.6cqw;align-items:center}
.sk>div.on{background:var(--teal)}
.sk canvas{aspect-ratio:1;width:100%;border-radius:1.6cqw;display:block}
.rr{font-size:2.3cqw;font-weight:800;border-radius:99px;padding:.1cqw 1.6cqw;border:.4cqw solid #111;color:#111}
.sk .pr{font-size:2.7cqw;border-radius:1.4cqw;padding:.4cqw 1.4cqw;border:.5cqw solid #111;background:#f3f3f3;white-space:nowrap}
.sk .pr.st{background:var(--gold)}.sk .pr.lk{background:#ddd;opacity:.85}.sk .pr.ok{background:#7bc47f}
.bundle{width:100%;background:linear-gradient(135deg,#ffd23a,#ff9a2e);color:#111;border:.9cqw solid #111;border-radius:3cqw;padding:2cqw 3cqw;display:flex;align-items:center;justify-content:space-between;gap:2cqw;text-align:left;font-size:3.4cqw}
.bundle b{font-size:3.8cqw}
.det{display:flex;flex-direction:column;align-items:center;gap:1.8cqw;width:100%}
.det canvas{width:70cqw;aspect-ratio:6/5;border:.9cqw solid #111;border-radius:3cqw}
.det h2{margin:0;font-size:6cqw}.det p{margin:0;font-size:3.4cqw;opacity:.9}
.note{font-size:3cqw;opacity:.8}
.lb{width:100%;font-size:3.3cqw;text-align:left;border-collapse:collapse}.lb td{padding:.9cqw 1cqw;border-bottom:.3cqw dashed #fff6}
#toast{position:absolute;left:50%;top:13%;transform:translate(-50%,0);background:#111;color:#fff;border-radius:99px;padding:1.4cqw 4cqw;font-weight:800;font-size:3.8cqw;opacity:0;pointer-events:none;white-space:nowrap;z-index:5;text-align:center}
#toast.on{animation:tz 2.4s}@keyframes tz{0%{opacity:0;transform:translate(-50%,10px)}10%,82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.up{color:#ffe94d;font-weight:800}
.trial{position:absolute;left:50%;top:2.4cqw;transform:translateX(-50%);background:var(--gold);color:#111;border:.6cqw solid #111;border-radius:99px;padding:.6cqw 3cqw;font-weight:800;font-size:3cqw;z-index:4;pointer-events:none;white-space:nowrap}
.tg .tgh{display:none!important}
.logo{font-weight:800;font-size:12cqw;line-height:.9;transform:rotate(-4deg);text-shadow:1cqw 1cqw 0 #111;letter-spacing:-.04em;margin-top:2cqw}.logo b{color:var(--red);display:block;font-size:13.5cqw}
</style>
</head>
<body>
<h1>flappy<span>farsh</span></h1>
<div class="wrap" id="wrap">
<canvas id="c" width="360" height="600"></canvas>
<div class="trial hide" id="trial">ПРОБНЫЙ ПОЛЁТ</div>
<div class="ov" id="menu"></div>
<div class="ov hide" id="over"></div>
<div class="ov top hide" id="modal"></div>
<div id="toast"></div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id),cv=$("c"),ctx=cv.getContext("2d");
const W=360,H=600,GROUND=540,BX=95,PW=64,FONT="Rubik,Arial,sans-serif",TAU=Math.PI*2,KEY="farsh_flappyfarsh_v1",OLD_KEYS=["ilyas_flappy_v3"];

/* =====================================================================
   ПЛАТФОРМА FarshGames (shared/farsh.js)
   ===================================================================== */
const F=window.Farsh,inTg=F.inTg,coarse=matchMedia("(pointer:coarse)").matches;
const dark=F.isDark,haptic=F.haptic,cloud=F.cloud;
function alertBox(t){F.alert(t,x=>toast(x,1))}
F.onTheme(()=>refreshUI());
function syncTgButtons(){
  const modal=!$("modal").classList.contains("hide"),overVis=!$("over").classList.contains("hide");
  F.back.set(onBack);
  let txt="";if(!modal&&state==="menu")txt="ИГРАТЬ ▶";else if(!modal&&state==="dead"&&overVis)txt="ЕЩЁ РАЗ ▶";
  F.main.set(txt?{text:txt,onClick:onMain}:null);
}
function onBack(){if(!$("modal").classList.contains("hide")){if(detail){detail=null;modalUI()}else closeModal()}else if(state!=="menu")toMenu();else F.goHub()}
function onMain(){if(state==="menu"||state==="dead")startReady()}

/* =====================================================================
   КАТАЛОГ: скины, миры, наборы
   ===================================================================== */
const RAR=[["Обычный","#e4dfe8"],["Редкий","#8ab4bc"],["Эпический","#c29be8"],["Мифический","#f08070"],["Легендарный","#ffd23a"]];
const SKINS=[
 {id:"classic",n:"Классика",r:0,un:{lvl:1},d:"Тот самый Ильяс."},
 {id:"pirate",n:"Пират",r:0,un:{lvl:3},hat:"band",d:"Бандана и решимость."},
 {id:"golden",n:"Золотой",r:1,un:{lvl:6},face:"#fff6d8",frame:"#c9930a",tie:"#7b3fa0",hat:"crown",trail:"gold",d:"Маленькая корона, большие амбиции."},
 {id:"dark",n:"Тёмный",r:1,un:{lvl:10},face:"#ece8cb",lens:"#4f8aa0",eye:"pupil",d:"Взгляд, от которого трубы расступаются."},
 {id:"pixel",n:"Пиксель",r:1,un:{lvl:15},px:1,d:"Привет из 8-битного прошлого."},
 {id:"rainbow",n:"Радужный",r:2,un:{lvl:20},rb:1,trail:"rainbow",d:"Переливается всеми цветами."},
 {id:"cutlet",n:"Котлета",r:1,un:{coins:400},face:"#a8602e",frame:"#3a1f0c",tie:"#e0584a",spots:1,lens:"#f4e6c8",d:"Аппетитный, хрустящий, летающий."},
 {id:"ninja",n:"Ниндзя",r:1,un:{coins:900},face:"#2b2733",frame:"#111",lens:"#fff",tie:"#e0584a",hat:"ninja",trail:"wind",d:"Бесшумный и быстрый."},
 {id:"neon",n:"Неон",r:2,un:{stars:25},neon:1,trail:"neon",d:"Светится в темноте и оставляет неоновый след."},
 {id:"astro",n:"Космонавт",r:2,un:{stars:50},hat:"helmet",trail:"stars",d:"Шлем, звёздный хвост и ноль гравитации в душе."},
 {id:"fire",n:"Огненный",r:2,un:{stars:50},face:"#ffe2b0",frame:"#b02a10",tie:"#ff9a2e",hat:"flame",trail:"fire",d:"Пылает так, что трубы плавятся."},
 {id:"vamp",n:"Вампир",r:3,un:{stars:75},face:"#e9e4f2",frame:"#2b0a14",lens:"#e03030",tie:"#7a0a1a",hat:"collar",fangs:1,trail:"bats",d:"Летает по ночам в окружении летучих мышей."},
 {id:"robot",n:"Робот",r:3,un:{stars:75},face:"#b8c0cc",frame:"#3a4250",lens:"#14202a",tie:"#3a4250",hat:"antenna",eye:"led",rivets:1,trail:"sparks",d:"Версия 2.0: светодиоды и искры."},
 {id:"dj",n:"Диджей",r:3,un:{stars:100},hat:"phones",chain:1,lens:"#1b1624",trail:"notes",d:"Наушники, цепь и музыкальный хвост."},
 {id:"ghost",n:"Призрак",r:3,un:{stars:100},ghost:1,trail:"ghost",d:"Полупрозрачный и немного жуткий."},
 {id:"king",n:"Король Котлет",r:4,un:{stars:150},face:"#fff6d8",frame:"#c9930a",tie:"#e0584a",hat:"bigcrown",cape:1,trail:"gold2",d:"Корона, мантия и золотой дождь. Легенда."}];
const WORLDS=[
 {id:"lab",n:"Лаборатория",r:0,un:{lvl:1},d:"Родная сиреневая лаборатория."},
 {id:"night",n:"Ночной город",r:1,un:{lvl:8},d:"Огни окон и луна над крышами."},
 {id:"sea",n:"Под водой",r:1,un:{coins:600},d:"Пузыри, водоросли и коралловые трубы."},
 {id:"space",n:"Космос",r:2,un:{stars:50},d:"Звёзды, планета с кольцами, металлические трубы."},
 {id:"hell",n:"Фаршевый ад",r:3,un:{stars:50},d:"Лава, искры и мясные трубы."}];
const SFXP=[
 {id:"skin",n:"Звуки скина",r:0,un:{lvl:1},d:"У каждого скина свой голос: взмах, монета и удар."},
 {id:"retro",n:"Ретро-аркада",r:1,un:{stars:25},d:"Чистый 8-бит, как на старой приставке."},
 {id:"toon",n:"Мультик",r:2,un:{stars:50},d:"Пружинки, свистки и смешные «бдыщ»."},
 {id:"laser",n:"Лазер-шоу",r:2,un:{stars:50},d:"Пиу-пиу! Каждый взмах — выстрел."},
 {id:"meat",n:"Мясорубка",r:3,un:{stars:75},d:"Хлюп, шкворч и хруст. Фаршевее некуда."}];
const MUSP=[
 {id:"world",n:"Музыка мира",r:0,un:{lvl:1},d:"У каждого мира своя мелодия."},
 {id:"synth",n:"Синтвейв",r:2,un:{stars:50},d:"Неон, закат и синтезаторы 80-х."},
 {id:"hard",n:"Хардбасс",r:2,un:{stars:50},d:"Прыгучий бас для самых быстрых этапов."},
 {id:"radio",n:"Фарш-радио",r:4,un:{stars:100},d:"Настоящие треки Ильяса Фарша по кругу."}];
const BUNDLE={k:"bundle:all",n:"Всё премиум: скины, миры, звук",stars:499};
const LISTS={skin:SKINS,world:WORLDS,sfx:SFXP,music:MUSP};
const findIt=(kind,id)=>(LISTS[kind]||[]).find(x=>x.id===id);

/* =====================================================================
   СОХРАНЕНИЕ
   ===================================================================== */
function defaults(){return{name:"ИЛЬЯС",xp:0,coins:0,best:0,runs:0,pipes:0,tc:0,upg:{gap:0,glide:0,shield:0,magnet:0,xp:0},skin:"classic",world:"lab",sfx:"skin",mus:"world",so:1,mo:1,bought:[],paid:[],pending:[],tried:[],ach:{},lb:[],maxStage:0,ts:0}}
function norm(s){const d=defaults();if(!s)return d;const o=Object.assign(d,s);o.upg=Object.assign(defaults().upg,s.upg||{});["bought","paid","pending","tried","lb"].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});if(!o.ach||typeof o.ach!=="object")o.ach={};if(!findIt("skin",o.skin))o.skin="classic";if(!findIt("world",o.world))o.world="lab";if(!findIt("sfx",o.sfx))o.sfx="skin";if(!findIt("music",o.mus))o.mus="world";return o}
function load(){
  let s=null;for(const k of[KEY].concat(OLD_KEYS)){if(s)break;try{s=JSON.parse(localStorage.getItem(k))}catch(e){}}
  if(!s){try{const v2=JSON.parse(localStorage.getItem("ilyas_flappy_v2"));if(v2){s=v2;s.skin=["classic","pirate","golden","dark","pixel","rainbow"][v2.skin|0]||"classic"}}catch(e){}}
  const o=norm(s);
  if(!s&&F.user)o.name=String(F.user.first_name||"ИГРОК").slice(0,12);
  return o;
}
let SV=load(),cloudT=0;
function save(){
  SV.ts=Date.now();const s=JSON.stringify(SV);try{localStorage.setItem(KEY,s)}catch(e){}
  clearTimeout(cloudT);cloudT=setTimeout(()=>{let j=s;if(j.length>4000)j=JSON.stringify(Object.assign({},SV,{lb:SV.lb.slice(0,3)}));if(j.length<=4096)cloud.set(KEY,j)},1500);
}
async function cloudLoad(){let v=await cloud.get(KEY);for(const k of OLD_KEYS)if(!v)v=await cloud.get(k);if(!v)return;try{const c=JSON.parse(v);if((c.ts||0)>(SV.ts||0)){SV=norm(c);try{localStorage.setItem(KEY,JSON.stringify(SV))}catch(e){}refreshUI()}}catch(e){}}

/* =====================================================================
   СЕРВЕР: покупки за звёзды
   ===================================================================== */
const SRV={ok:false,checked:false,prices:{},err:""};let buying=false;
async function syncOwned(waitFor){
  if(!inTg)return false;
  try{
    const s=waitFor?await F.store.waitOwned(waitFor):await F.store.load();
    if(!s){SRV.checked=true;refreshUI();return false}
    SRV.ok=true;SRV.checked=true;SRV.prices=s.prices||{};
    const pend=SV.pending.filter(p=>Date.now()-p.t<15*60e3&&!s.owned.includes(p.k));
    SV.pending=pend;SV.paid=[...new Set(s.owned.concat(pend.map(p=>p.k)))];save();refreshUI();return true;
  }catch(e){SRV.ok=false;SRV.checked=true;SRV.err=e.message;refreshUI();return false}
}
const starPrice=(k,def)=>SRV.prices[k]||def;
async function buyStars(k){
  if(!inTg){alertBox("Покупка за звёзды работает в FarshGames внутри Telegram. Здесь можно примерить скин и сделать пробный полёт.");return}
  if(!F.store.available()){alertBox("Обнови Telegram, чтобы покупать скины.");return}
  if(buying)return;buying=true;refreshUI();
  let st;
  try{st=await F.store.buy(k)}catch(e){buying=false;refreshUI();alertBox(e.message==="already"?"Этот предмет уже у тебя.":"Не удалось открыть оплату: "+e.message);if(e.message==="already")syncOwned();return}
  buying=false;
  if(st==="paid"){haptic("ok");SV.pending.push({k,t:Date.now()});SV.paid=[...new Set(SV.paid.concat(k))];autoEquip(k);save();toast("Спасибо! Покупка твоя ⭐");burst();syncOwned(k)}
  else if(st==="failed"){haptic("err");toast("Оплата не прошла")}
  else if(st==="pending"){toast("Ждём подтверждения оплаты…");syncOwned(k)}
  refreshUI();
}
function autoEquip(k){const[kind,id]=k.split(":");if(kind==="skin")SV.skin=id;else if(kind==="world")SV.world=id;else if(kind==="sfx")SV.sfx=id;else if(kind==="music"){SV.mus=id;AU.prev=null}}

/* =====================================================================
   ПРОГРЕССИЯ
   ===================================================================== */
const need=l=>Math.floor(60*Math.pow(l,1.45));
function lvlOf(xp){let l=1,x=xp;while(x>=need(l)){x-=need(l);l++}return{l,x,n:need(l)}}
const level=()=>lvlOf(SV.xp).l;
const LG=[["Новичок",0,"#c3bacb"],["Бронза",40,"#d08a5a"],["Серебро",120,"#b8c0cc"],["Золото",300,"#f2c230"],["Платина",600,"#8ab4bc"],["Алмаз",1000,"#7fd4ff"],["Легенда",1600,"#e0584a"]];
const rating=()=>SV.lb.reduce((a,e)=>a+e.s,0);
const league=r=>{let i=0;while(i+1<LG.length&&r>=LG[i+1][1])i++;return i};
function has(kind,it){const u=it.un,k=kind+":"+it.id;if(u.lvl)return level()>=u.lvl;if(u.coins)return SV.bought.includes(k);if(u.stars)return SV.paid.includes(k)||SV.paid.includes(BUNDLE.k);return true}
const ownedCount=()=>SKINS.filter(s=>has("skin",s)).length;
const UPG=[
 {k:"gap",n:"Широкий проход",d:"+5 px к проёму",max:5,cost:l=>30+l*35},
 {k:"glide",n:"Плавное падение",d:"слабее гравитация",max:5,cost:l=>40+l*40},
 {k:"shield",n:"Щит",d:"переживает удар (заряды на заход)",max:3,cost:l=>80+l*120},
 {k:"magnet",n:"Магнит «?»",d:"притягивает монеты",max:5,cost:l=>25+l*30},
 {k:"xp",n:"Опыт +25%",d:"больше XP за заход",max:4,cost:l=>60+l*60}];
const ACH=[
 ["first","Первый полёт","сыграй один заход",()=>SV.runs>=1],["p10","Десятка","10 труб за заход",()=>SV.best>=10],["p25","Четвертак","25 труб за заход",()=>SV.best>=25],
 ["p50","Полтинник","50 труб за заход",()=>SV.best>=50],["p100","Сотня","100 труб за заход",()=>SV.best>=100],["c100","Коллекционер","собери 100 «?» всего",()=>SV.tc>=100],

      if(mg&&dist<mg){c.ox+=dx*.12*d;c.oy+=dy*.12*d}if(dist<26){c.ok=true;runCoins+=c.v;haptic("sel");sfx(c.v>1?"big":"coin");toast(c.v>1?"+"+c.v+" «?»!":"+1 «?»")}}
    if(inv<=0&&BX+17>p.x&&BX-17<p.x+PW&&(y-17<p.gy||y+17>p.gy+p.g)){if(shield>0){shield--;inv=70;vy=-5;y=p.gy+p.g/2;shake=6;haptic("heavy");sfx("shield");toast("🛡 щит спас!")}else{die();return}}
  }
  if(y+20>GROUND){if(inv>0){y=GROUND-20;vy=-6}else if(shield>0){shield--;inv=70;vy=-9;y=GROUND-24;haptic("heavy");sfx("shield");toast("🛡 щит спас!")}else{die();return}}
  if(y<-40){if(inv<=0&&shield>0){shield--;inv=70;y=40;vy=2;sfx("shield")}else if(inv<=0){die();return}}
}

let emitAcc=0;
function mkPart(k,x,yy,s){const p={k,x,y:yy+(Math.random()-.5)*14,vx:-s*(k==="wind"?1.6:.9),vy:(Math.random()-.5)*.6,life:0,max:k==="notes"||k==="bats"?55:k==="ghost"?40:30,h:t*6%360,r:Math.random()};
  if(k==="fire"){p.vy=-.6-Math.random()*.6;p.vx=-s*.6}if(k==="sparks"){p.vx=-s*1.1-Math.random()*1.5;p.vy=(Math.random()-.5)*2.4}if(k==="notes"||k==="bats"){p.vy=-.5-Math.random()*.5;p.vx=-s*.7}return p}
function trailEmit(d,s){
  const S=curSkin();if(!S.trail)return;emitAcc+=d;const rate={rainbow:.6,fire:.5,gold2:.6,neon:.7,stars:1.2,notes:4,bats:3.2,wind:1.4,sparks:.9,gold:1.1,ghost:1.2}[S.trail]||1;
  const bx=state==="menu"?BX+85-20:BX-20,by=state==="menu"?y-40:y;
  while(emitAcc>=rate){emitAcc-=rate;parts.push(mkPart(S.trail,bx,by,s));if(parts.length>160)parts.shift()}
}
function updParts(d){for(const p of parts){p.x+=p.vx*d;p.y+=p.vy*d;p.life+=d}for(let i=parts.length-1;i>=0;i--)if(parts[i].life>parts[i].max)parts.splice(i,1)}
function drawParts(c,list){
  for(const p of list){const a=1-p.life/p.max;c.save();c.globalAlpha=Math.max(0,a);c.translate(p.x,p.y);
    switch(p.k){
      case"rainbow":c.fillStyle="hsl("+p.h+",90%,60%)";c.beginPath();c.arc(0,0,7*a+2,0,TAU);c.fill();break;
      case"fire":c.fillStyle=a>.6?"#ffd23a":a>.3?"#ff7a1a":"#c0262e";c.beginPath();c.arc(0,0,8*a+2,0,TAU);c.fill();break;

      case"gold2":c.fillStyle=p.r>.5?"#ffd23a":"#fff6b0";c.strokeStyle="#111";c.lineWidth=1.2;c.beginPath();c.ellipse(0,0,4.4*(.6+.4*Math.abs(Math.sin(p.life*.3))),4.4,0,0,TAU);c.fill();c.stroke();break;
      case"neon":c.fillStyle=p.r>.5?"#3df0ff":"#ff7ab0";c.shadowColor=c.fillStyle;c.shadowBlur=8;c.fillRect(-3,-3,6,6);break;
      case"stars":c.fillStyle="#fff6b0";c.strokeStyle="#111";c.lineWidth=1;c.rotate(p.life*.15);c.beginPath();for(let i=0;i<10;i++){const rr=i%2?2.2:5.4,an=i*Math.PI/5;c.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}c.closePath();c.fill();c.stroke();break;
      case"notes":c.fillStyle=p.r>.5?"#ffd23a":"#ff7ab0";c.strokeStyle="#111";c.lineWidth=2.4;c.font="800 16px "+FONT;c.textAlign="center";c.textBaseline="middle";c.strokeText(p.r>.5?"♪":"♫",0,0);c.fillText(p.r>.5?"♪":"♫",0,0);break;
      case"bats":{const f=Math.sin(p.life*.6)*4;c.fillStyle="#1b1624";c.beginPath();c.moveTo(0,0);c.lineTo(-8,-3-f);c.lineTo(-5,1);c.lineTo(-2,0);c.lineTo(0,3);c.lineTo(2,0);c.lineTo(5,1);c.lineTo(8,-3-f);c.closePath();c.fill();break}
      case"wind":c.strokeStyle="rgba(255,255,255,.9)";c.lineWidth=2;c.beginPath();c.moveTo(0,0);c.lineTo(14,0);c.stroke();break;
      case"sparks":c.strokeStyle=p.r>.5?"#ffd23a":"#3df080";c.lineWidth=2;c.beginPath();c.moveTo(0,0);c.lineTo(-p.vx*2,-p.vy*2);c.stroke();break;

}

function tone(t,m,d,w,v,dist,echo){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=WAVE[w];o.frequency.value=hz(m);

  if(S.bass){const ch=at(S.bass[0],i),d={r:0,t:2,f:4,o:7}[ch];if(d!==undefined)tone(t,m(p+d,-12),len(S.bass[0],i)*.9,S.bass[1],S.bass[2],S.dist,0)}

function drawDetail(){
  const c=$("dcv");if(!c||!detail)return;const g=c.getContext("2d"),it=findIt(detail.kind,detail.id);
  const wid=detail.kind==="world"?it.id:"lab",S=detail.kind==="skin"?it:findIt("skin",SV.skin),k=300/W;
  g.save();g.clearRect(0,0,300,250);
  g.save();g.scale(k,k);g.translate(0,-80);drawWorld(g,wid,false,0);if(detail.kind==="world")drawPipe(g,{x:300-((t*1.4)%140),gy:170,g:190},pipeStyle(wid,0));g.restore();
  g.fillStyle=GROUNDC[wid]||"#fff";g.fillRect(0,222,300,28);g.fillStyle="#111";g.fillRect(0,222,300,3);
  const by=118+Math.sin(t/12)*10;
  if(S.trail&&Math.random()<.5){const p=mkPart(S.trail,118,by,2.2);p.x=118;detParts.push(p)}
  for(const p of detParts){p.x+=p.vx;p.y+=p.vy;p.life++}for(let i=detParts.length-1;i>=0;i--)if(detParts[i].life>detParts[i].max)detParts.splice(i,1);
  drawParts(g,detParts);g.save();g.translate(150,by);g.scale(1.45,1.45);bird(g,0,0,Math.sin(t/20)*.08,S,t);g.restore();g.restore();
}
function openModal(k){tab=k;detail=null;modalUI();hide("menu");hide("over");show("modal");syncTgButtons()}
function closeModal(){hide("modal");detail=null;if(AU.prev){AU.prev=null;auVol()}if(state==="menu"){menuUI();show("menu")}else if(state==="dead")show("over");syncTgButtons()}
function refreshUI(){if(!$("modal").classList.contains("hide"))modalUI();else if(state==="menu")menuUI();syncTgButtons()}
function toMenu(){state="menu";trial=null;auDuck(1);$("trial").classList.add("hide");reset();hide("over");hide("modal");menuUI();show("menu");syncTgButtons()}
function startReady(){
  if(state==="dead"&&$("over").classList.contains("hide"))return;
  tryOn=null;AU.prev=null;auDuck(1);reset();state="ready";hide("menu");hide("over");hide("modal");
  if(trial){$("trial").textContent="ПРОБНЫЙ ПОЛЁТ · "+findIt(trial.kind,trial.id).n;show("trial")}
  syncTgButtons();
}
function burst(){sfx("buy");for(let i=0;i<40;i++)parts.push({k:i%2?"gold2":"stars",x:W/2+(Math.random()-.5)*60,y:H/2,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:0,max:50,h:0,r:Math.random()})}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;haptic("light");if(!a.startsWith("hear:"))sfx("ui");
  if(a==="play"||a==="again")startReady();
  else if(a==="hub")F.goHub();
  else if(a==="menu")toMenu();
  else if(a.startsWith("tab:")){if($("modal").classList.contains("hide"))openModal(a.slice(4));else{tab=a.slice(4);detail=null;modalUI()}}
  else if(a==="close")closeModal();
  else if(a==="back"){detail=null;if(AU.prev){AU.prev=null;auVol()}modalUI()}
  else if(a.startsWith("det:")){const[,kind,id]=a.split(":");detail={kind,id};detParts.length=0;modalUI()}
  else if(a.startsWith("equip:")){const[kind,id]=a.slice(6).split(":");if(has(kind,findIt(kind,id))){autoEquip(kind+":"+id);tryOn=null;save();haptic("ok");if(kind==="sfx")hearPack(voice());if(kind==="music"&&!SV.mo){SV.mo=1;save();auVol()}modalUI()}}
  else if(a.startsWith("hear:")){const[,kind,id]=a.split(":");auInit();
    if(kind==="skin")hearPack(SND[id]||SND.classic);
    else if(kind==="sfx")hearPack(id==="skin"?SND[SV.skin]||SND.classic:SND[id]);
    else{const pk=kind==="world"?"w:"+id:id==="world"?"w:"+SV.world:id==="radio"?"radio":"p:"+id;AU.prev=AU.prev===pk?null:pk;auVol();setTimeout(auTick,0)}
    modalUI()}
  else if(a==="tog:so"){SV.so=SV.so?0:1;save();modalUI()}
  else if(a==="tog:mo"){SV.mo=SV.mo?0:1;save();auVol();modalUI()}
  else if(a==="rnext"){radioNext(0)}
  else if(a.startsWith("coin:")){const[kind,id]=a.slice(5).split(":"),it=findIt(kind,id),k=kind+":"+id;if(!SV.bought.includes(k)&&SV.coins>=it.un.coins){SV.coins-=it.un.coins;SV.bought.push(k);autoEquip(k);save();haptic("ok");toast("Открыто: "+it.n);burst();refreshUI()}}
  else if(a.startsWith("buy:"))buyStars(a.slice(4));
  else if(a.startsWith("tryon:")){const[kind,id]=a.slice(6).split(":");tryOn={kind,id};closeModal();toast("Примерка: "+findIt(kind,id).n)}
  else if(a.startsWith("trial:")){const k=a.slice(6),[kind,id]=k.split(":");if(!SV.tried.includes(k)){SV.tried.push(k);save();trial={kind,id};tryOn=null;state="menu";startReady()}}
  else if(a.startsWith("upg:")){const u=UPG.find(x=>x.k===a.slice(4)),l=SV.upg[u.k],c=u.cost(l);if(l<u.max&&SV.coins>=c){SV.coins-=c;SV.upg[u.k]++;save();haptic("ok");modalUI()}}
});
cv.addEventListener("pointerdown",e=>{e.preventDefault();if(state==="ready"||state==="play")flap()});
document.addEventListener("keydown",e=>{
  if(e.target&&e.target.tagName==="INPUT")return;
  if(e.code==="Escape"){onBack();return}
  if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){e.preventDefault();if(e.repeat)return;
    if(!$("modal").classList.contains("hide"))return;
    if(state==="menu")startReady();else if(state==="dead"){if(!$("over").classList.contains("hide"))startReady()}else flap()}
});
document.addEventListener("visibilitychange",()=>{last=0});
function loop(now){const d=Math.min(2.5,(now-(last||now))/16.667);last=now;update(d);draw();if(detail)drawDetail();requestAnimationFrame(loop)}
reset();menuUI();syncTgButtons();requestAnimationFrame(loop);
cloudLoad().then(()=>syncOwned());
</script>
</body>
